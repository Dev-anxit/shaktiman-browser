<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://127.0.0.1:8000 http://localhost:8000 https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http://127.0.0.1:8000 http://localhost:8000; font-src 'self' data:; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https:; object-src 'none';">
  <title>Shaktiman Start Page</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    :root, [data-theme="dark"] {
      --bg-layer: #09090b;
      --bg-color: #09090b;
      --card-bg: #121215;
      --glass-bg: #121215;
      --glass-border: #27272a;
      --glass-pill: #18181b;
      --input-bg: #18181b;
      --text-primary: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --link: #60a5fa;
      --mark-bg: #fbbf24;
      --mark-text: #09090b;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.5);
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }
    [data-theme="light"] {
      --bg-layer: #ffffff;
      --bg-color: #ffffff;
      --card-bg: #ffffff;
      --glass-bg: #ffffff;
      --glass-border: #e2e8f0;
      --glass-pill: #f1f5f9;
      --input-bg: #f8fafc;
      --text-primary: #0f172a;
      --text-muted: #475569;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.2);
      --link: #1a0dab;
      --mark-bg: #fef08a;
      --mark-text: #0f172a;
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }
    html, body {
      min-height: 100vh;
      width: 100%;
      background: var(--bg-layer);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    div#bg-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-layer);
      z-index: -2;
      pointer-events: none;
      transition: background 0.2s ease;
    }
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .start-logo-area {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: -0.75rem;
    }
    .start-hero-logo {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 3px solid rgba(251, 191, 36, 0.7);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.4);
      object-fit: cover;
      transition: transform 0.35s var(--spring);
      cursor: pointer;
    }
    .start-hero-logo:hover {
      transform: scale(1.08) rotate(4deg);
    }
    .clock-area {
      text-align: center;
    }
    .clock-time {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 0.4rem;
      color: var(--text-primary);
    }
    .clock-greeting {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .search-pill-card {
      width: 100%;
      max-width: 680px;
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 6px 8px 6px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-card);
      transition: all 0.25s var(--spring);
    }
    .search-pill-card:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-card);
      transform: translateY(-2px);
    }
    .search-input {
      flex: 1;
      height: 44px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1.05rem;
      color: var(--text-primary);
      user-select: text;
    }
    .search-btn {
      height: 40px;
      padding: 0 18px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s var(--spring);
    }
    .search-btn:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }
    .tiles-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }
    @media (max-width: 680px) {
      .tiles-grid {
        grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
        gap: 12px;
      }
    }
    .tile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 6px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: all 0.25s var(--spring);
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .tile-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--accent);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), 0 0 15px var(--accent-glow);
    }
    .tile-glyph {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--glass-pill);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08);
      transition: transform 0.25s var(--spring);
      overflow: hidden;
    }
    .tile-card:hover .tile-glyph {
      transform: scale(1.08);
    }
    .tile-brand-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 8px;
    }
    .tile-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-primary);
      max-width: 86px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .theme-pill-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      box-shadow: var(--shadow-card);
    }
    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--glass-pill);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s var(--spring);
    }
    .theme-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.05);
    }
    [data-theme="dark"] .sun-icon {
      display: block;
    }
    [data-theme="dark"] .moon-icon {
      display: none;
    }
    [data-theme="light"] .sun-icon {
      display: none;
    }
    [data-theme="light"] .moon-icon {
      display: block;
    }
    .creator-footer-pill {
      margin-top: 1rem;
    }
    .creator-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .creator-link:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }
    .creator-bolt {
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <div id="bg-layer"></div>

  <div class="container">
    <div class="start-logo-area">
      <img src="assets/logo.png" class="start-hero-logo" alt="Shaktiman Browser">
    </div>
    <div class="clock-area">
      <div class="clock-time" id="clockTime">12:00</div>
      <div class="clock-greeting" id="clockGreeting">Welcome to Shaktiman</div>
    </div>

    <form class="search-pill-card" id="startForm">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.6;">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="search-input" id="startInput" placeholder="Search knowledge base, local docs, or type URL..." autofocus autocomplete="off">
      <button type="submit" class="search-btn">Search</button>
    </form>

    <div class="tiles-grid" id="tilesGrid"></div>

    <div class="theme-pill-bar">
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
        <svg class="sun-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="creator-footer-pill">
      <a href="https://ankit-portfolio-ten-tawny.vercel.app/" target="_blank" class="creator-link">
        <span class="creator-bolt">⚡</span>
        <span>Crafted & Owned by DevXanxit © 2026</span>
      </a>
    </div>
  </div>

  <script>
    const FAVORITES = [
      {
        title: 'Local Search',
        url: 'http://localhost:8000/',
        bg: 'rgba(245, 158, 11, 0.12)',
        iconHtml: '<img src="assets/logo.png" class="tile-brand-img" alt="Local Search">'
      },
      {
        title: 'Google',
        url: 'https://www.google.com',
        bg: '#ffffff',
        iconHtml: '<svg width="28" height="28" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>'
      },
      {
        title: 'YouTube',
        url: 'https://youtube.com',
        bg: 'rgba(255, 0, 0, 0.08)',
        iconHtml: '<svg width="30" height="30" viewBox="0 0 24 24"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><polygon fill="#FFFFFF" points="9.545,15.568 15.818,12 9.545,8.432"/></svg>'
      },
      {
        title: 'GitHub',
        url: 'https://github.com',
        bg: '#18181b',
        iconHtml: '<svg width="28" height="28" viewBox="0 0 24 24" fill="#ffffff"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>'
      },
      {
        title: 'Reddit',
        url: 'https://reddit.com',
        bg: 'rgba(255, 69, 0, 0.12)',
        iconHtml: '<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FF4500"/><path fill="#FFFFFF" d="M16.67 11.83a1.27 1.27 0 0 0-.87.35 6.33 6.33 0 0 0-3.8-1.15l.65-3.05 2.12.45a.94.94 0 1 0 .2-.62l-2.4-.5a.28.28 0 0 0-.33.22l-.76 3.55a6.45 6.45 0 0 0-3.9 1.15 1.28 1.28 0 0 0-1.78 1.48 2.6 2.6 0 0 0 .04 1.77c-.03.17-.04.34-.04.52 0 2.63 2.9 4.77 6.48 4.77s6.48-2.14 6.48-4.77c0-.18-.01-.35-.04-.52a2.6 2.6 0 0 0 .04-1.77 1.28 1.28 0 0 0-.9-1.89zm-7.42 1.42a.85.85 0 1 1-.85.85.85.85 0 0 1 .85-.85zm5.5 3.3a3.5 3.5 0 0 1-2.75.8 3.5 3.5 0 0 1-2.75-.8.25.25 0 0 1 .35-.35 3 3 0 0 0 2.4.67 3 3 0 0 0 2.4-.67.25.25 0 0 1 .35.35zm-.32-2.45a.85.85 0 1 1 .85-.85.85.85 0 0 1-.85.85z"/></svg>'
      },
      {
        title: 'Wikipedia',
        url: 'https://en.wikipedia.org',
        bg: 'rgba(255, 255, 255, 0.08)',
        iconHtml: '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12.09 13.124l2.12-6.528h2.046l-3.328 8.84h-1.636l-2.124-6.386-2.124 6.386H5.408l-3.328-8.84h2.046l2.12 6.528 2.05-6.528h1.744l2.05 6.528zm6.502 2.312h1.83l-3.78-8.84h-1.83l3.78 8.84zm3.578 0h1.83l-3.78-8.84H18.39l3.78 8.84z"/></svg>'
      },
      {
        title: 'X',
        url: 'https://x.com',
        bg: '#000000',
        iconHtml: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
      },
      {
        title: 'DuckDuckGo',
        url: 'https://duckduckgo.com',
        bg: 'rgba(222, 88, 51, 0.12)',
        iconHtml: '<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#DE5833"/><path fill="#FFFFFF" d="M12 4.5c-2.4 0-4.2 1.5-4.2 3.5 0 .8.3 1.5.8 2-.6.7-1.1 1.7-1.1 2.8 0 2.6 2.3 4.7 5.2 4.7 1.8 0 3.3-.8 4.2-2.1.8-.1 1.6-.5 2.1-1.1.8-.9.9-2.1.2-3.1 1-.5 1.6-1.5 1.6-2.6 0-2.3-2-4.1-4.8-4.1zm-1.8 2.8c.6 0 1.1.5 1.1 1.1s-.5 1.1-1.1 1.1-1.1-.5-1.1-1.1.5-1.1 1.1-1.1zm3.8 0c.6 0 1.1.5 1.1 1.1s-.5 1.1-1.1 1.1-1.1-.5-1.1-1.1.5-1.1 1.1-1.1z"/><ellipse cx="12" cy="12.5" rx="3.5" ry="1.8" fill="#F8A51D"/></svg>'
      },
      {
        title: 'Hacker News',
        url: 'https://news.ycombinator.com',
        bg: 'rgba(255, 102, 0, 0.12)',
        iconHtml: '<svg width="28" height="28" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#FF6600"/><text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">Y</text></svg>'
      },
      {
        title: 'MDN Web',
        url: 'https://developer.mozilla.org',
        bg: 'rgba(33, 100, 243, 0.1)',
        iconHtml: '<svg width="28" height="28" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#0c0d0e"/><path fill="#2164f3" d="M3 6h3v12H3z"/><path fill="#ffffff" d="M8 8h2v8H8zm4 0h2v8h-2zm4 0h2v8h-2z"/><path fill="#2164f3" d="M18 6h3v12h-3z"/></svg>'
      }
    ];

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${hours}:${mins}`;
      const clockEl = document.getElementById('clockTime');
      if (clockEl) clockEl.textContent = timeStr;

      let greet = 'Good evening';
      if (hours < 12) greet = 'Good morning';
      else if (hours < 18) greet = 'Good afternoon';
      const greetEl = document.getElementById('clockGreeting');
      if (greetEl) greetEl.textContent = `${greet}, Explorer`;
    }

    function renderFavorites() {
      const grid = document.getElementById('tilesGrid');
      if (!grid) return;
      grid.innerHTML = FAVORITES.map(fav => `
        <div class="tile-card" onclick="navigate('${fav.url}')" title="${fav.title}">
          <div class="tile-glyph" style="background:${fav.bg};">${fav.iconHtml}</div>
          <div class="tile-title">${fav.title}</div>
        </div>
      `).join('');

      FAVORITES.forEach(fav => {
        try {
          const u = new URL(fav.url);
          if (u.protocol === 'http:' || u.protocol === 'https:') {
            const link = document.createElement('link');
            link.rel = 'dns-prefetch';
            link.href = u.origin;
            document.head.appendChild(link);
          }
        } catch (e) {}
      });
    }

    function navigate(url) {
      window.location.href = url;
    }

    const startForm = document.getElementById('startForm');
    const startInput = document.getElementById('startInput');

    if (startForm) {
      startForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = startInput.value.trim();
        if (!val) return;
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        if (val.startsWith('http://') || val.startsWith('https://')) {
          window.location.href = val;
        } else if (/^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}/.test(val)) {
          window.location.href = 'https://' + val;
        } else {
          window.location.href = 'http://localhost:8000/?q=' + encodeURIComponent(val) + '&theme=' + currentTheme;
        }
      });
    }

    function initTheme() {
      const urlParams = new URLSearchParams(window.location.search);
      const queryTheme = urlParams.get('theme');
      const savedTheme = localStorage.getItem('shaktiman_theme');
      const theme = queryTheme || savedTheme || 'dark';
      setTheme(theme);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('shaktiman_theme', theme); } catch (e) {}
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const target = current === 'dark' ? 'light' : 'dark';
      setTheme(target);
    }

    updateClock();
    setInterval(updateClock, 1000);
    renderFavorites();
    initTheme();
  </script>
</body>
</html>
